name: Backup production database

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Create encrypted-access database backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          pg_dump --version

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          backup_name="skilltogether-$(date -u +'%Y-%m-%dT%H-%M-%SZ').dump"

          pg_dump \
            --dbname="$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backups/$backup_name"

          pg_restore --list "backups/$backup_name" > /dev/null

      - name: Retain backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: skilltogether-database-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error
