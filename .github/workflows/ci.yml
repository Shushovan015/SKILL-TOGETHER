name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_PERSISTENCE: memory
      DATABASE_URL: postgresql://skilltogether:skilltogether_test_password@localhost:5432/skilltogether_test
      SESSION_SECRET: ci-session-secret-for-auth-validation-0001
      CSRF_SECRET: ci-csrf-secret-for-auth-validation-000001
      SESSION_COOKIE_SECURE: "false"
      WEB_ORIGIN: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5174

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skilltogether_test
          POSTGRES_USER: skilltogether
          POSTGRES_PASSWORD: skilltogether_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skilltogether -d skilltogether_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
