services:
  postgres:
    image: postgres:16-alpine
    container_name: skilltogether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skilltogether_dev}
      POSTGRES_USER: ${POSTGRES_USER:-skilltogether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilltogether_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
